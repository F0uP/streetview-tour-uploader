name: Build and Release

# Push a tag like "v1.2.0" to build the app for every platform and publish it
# as a GitHub Release (the installed Windows app updates itself from there).
# "Run workflow" in the Actions tab builds and tests everything without
# releasing - handy for testing this pipeline itself.
#
#   Windows  x64 + x86       Setup.exe and portable zip (x64 also runs on Windows on ARM)
#   macOS    arm64 + x64     .dmg (Apple Silicon and Intel)
#   Linux    amd64 + arm64   one .deb for both (Debian 12, Ubuntu 24.04 or newer)
#
# Every package is started once on a fresh machine before anything is released
# (run_editor.py --smoke-test: opens the app window, checks the editor works,
# quits): the Linux package on Ubuntu 24.04 (amd64 and arm64), Ubuntu 26.04 and
# Debian 12, the Windows x64 build also on Windows on ARM.
#
# Optional repository secrets (without them the builds are unsigned):
#   Windows code signing (Azure Trusted Signing), all six:
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#     TRUSTED_SIGNING_ENDPOINT (e.g. https://weu.codesigning.azure.net),
#     TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE
#   or Windows code signing with SignPath (free for open source, see
#     packaging/signpath/README.md): the secret SIGNPATH_API_TOKEN and the
#     repository variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG
#     (and SIGNPATH_SIGNING_POLICY_SLUG, default "release-signing").
#     Azure is used when both are set.
#   macOS signing: MACOS_CERTIFICATE (base64 of a "Developer ID Application"
#     .p12), MACOS_CERTIFICATE_PASSWORD; plus notarization: APPLE_ID,
#     APPLE_TEAM_ID, APPLE_APP_PASSWORD (an app-specific password)
#   winget: WINGET_TOKEN (classic PAT with public_repo scope) - opens the
#     update PR against microsoft/winget-pkgs after each release.
#   apt repository on GitHub Pages: APT_GPG_PRIVATE_KEY (an armored private
#     key without passphrase, only for this) - each release's .deb is added to
#     the repository in the gh-pages branch (see packaging/linux/apt_repo.py).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  # The app's window on a machine without a desktop session and GPU.
  WEBKIT_DISABLE_DMABUF_RENDERER: '1'
  LIBGL_ALWAYS_SOFTWARE: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Every build ships editor/vendor: it has to be exactly what the lock says.
      - name: Check the bundled web libraries
        run: python3 packaging/vendor.py --check

      - id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${{ github.run_number }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Nothing is built unless the tests pass (tests.yml).
  tests:
    uses: ./.github/workflows/tests.yml

  windows:
    needs: [version, tests]
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read  # SignPath fetches the files to sign from this run
    env:
      SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.TRUSTED_SIGNING_ACCOUNT != '' }}
      SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && !(secrets.AZURE_CLIENT_ID != '' && secrets.TRUSTED_SIGNING_ACCOUNT != '') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Set up code signing
        if: env.SIGNING == 'true'
        shell: pwsh
        env:
          TS_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TS_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TS_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "trusted-signing"
          nuget install Microsoft.Trusted.Signing.Client -x -OutputDirectory $dir | Out-Null
          $dlib = Get-ChildItem $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object FullName -like '*x64*' | Select-Object -First 1
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $meta = Join-Path $dir "metadata.json"
          @{ Endpoint = $env:TS_ENDPOINT; CodeSigningAccountName = $env:TS_ACCOUNT; CertificateProfileName = $env:TS_PROFILE } | ConvertTo-Json | Set-Content $meta
          "SIGN_CMD=`"$($signtool.FullName)`" sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib `"$($dlib.FullName)`" /dmdf `"$meta`" `"{file}`"" >> $env:GITHUB_ENV

      - name: Build app, portable zip and installer
        if: env.SIGNPATH != 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python build_exe.py --version ${{ needs.version.outputs.version }}

      # SignPath signs files it fetches from this run: first the app, then the
      # installer built around the signed app.
      - name: Build the app (signed next)
        if: env.SIGNPATH == 'true'
        run: python build_exe.py --version ${{ needs.version.outputs.version }} --stage app

      - id: unsigned-app
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app-${{ matrix.arch }}
          path: dist/StreetviewTourEditor/StreetviewTourEditor.exe
          if-no-files-found: error

      - name: Sign the app with SignPath
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/app

      - name: Put the signed app in place
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed/app -Recurse -Filter StreetviewTourEditor.exe | Select-Object -First 1
          if (-not $signed) { throw 'SignPath returned no StreetviewTourEditor.exe' }
          Copy-Item $signed.FullName dist/StreetviewTourEditor/StreetviewTourEditor.exe -Force

      - name: Portable zip and installer around the signed app
        if: env.SIGNPATH == 'true'
        run: python build_exe.py --version ${{ needs.version.outputs.version }} --stage package

      - id: unsigned-setup
        if: env.SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup-${{ matrix.arch }}
          path: dist/*-Setup*.exe
          if-no-files-found: error

      - name: Sign the installer with SignPath
        if: env.SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/setup

      - name: Put the signed installer in place
        if: env.SIGNPATH == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem signed/setup -Recurse -Filter '*-Setup*.exe')
          if (-not $signed) { throw 'SignPath returned no Setup.exe' }
          $signed | ForEach-Object { Copy-Item $_.FullName (Join-Path dist $_.Name) -Force }

      - name: Smoke test
        shell: pwsh
        run: ./.github/scripts/smoke-test-windows.ps1 -Exe dist\StreetviewTourEditor\StreetviewTourEditor.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*-Setup*.exe
            dist/*-portable.zip
          if-no-files-found: error

  windows-on-arm:
    # No native ARM64 build (pythonnet, which the window needs, has none):
    # check that the x64 build runs through Windows' x64 emulation.
    needs: windows
    name: Windows on ARM (x64 build)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: dist
      - name: Unpack the portable build
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem dist\*-windows-x64-portable.zip).FullName -DestinationPath app
      - name: Smoke test
        shell: pwsh
        run: ./.github/scripts/smoke-test-windows.ps1 -Exe app\StreetviewTourEditor\StreetviewTourEditor.exe

  macos:
    needs: [version, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Set up code signing
        if: env.MAC_SIGNING == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build app and disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python build_exe.py --version ${{ needs.version.outputs.version }}

      - name: Smoke test
        run: |
          set +e
          "dist/Streetview Tour Editor.app/Contents/MacOS/Streetview Tour Editor" --smoke-test
          code=$?
          tail -n 30 "$HOME/Library/Application Support/StreetviewTourEditor/editor.log"
          exit $code

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    needs: [version, tests]
    name: Linux package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The oldest Python the package supports decides which backports get bundled.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check the app compiles on Python 3.11
        run: python -m py_compile run_editor.py google_api.py places.py bug_report.py app_window.py app_update.py app_tray.py

      - name: Build .deb
        run: python packaging/linux/build_deb.py --version ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*.deb
          if-no-files-found: error

  linux-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 amd64
            runner: ubuntu-24.04
          - name: Ubuntu 24.04 arm64
            runner: ubuntu-24.04-arm
          - name: Ubuntu 26.04 amd64
            runner: ubuntu-24.04
            container: ubuntu:26.04
          - name: Debian 12 amd64
            runner: ubuntu-24.04
            container: debian:12
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - name: Install the package with apt
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update -q
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -q ca-certificates xvfb xauth ./dist/*.deb
      - name: Smoke test
        run: |
          set +e
          xvfb-run -a streetview-tour-editor --smoke-test
          code=$?
          tail -n 30 "$HOME/.config/streetview-tour-editor/editor.log"
          exit $code

  release:
    needs: [version, windows, windows-on-arm, macos, linux, linux-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The in-app updater refuses an installer it can't verify against this list.
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  apt-repo:
    # Adds the release's .deb to the apt repository in the gh-pages branch (folder
    # apt/, served by GitHub Pages), so "apt upgrade" brings it. Without the
    # APT_GPG_PRIVATE_KEY secret this is skipped. GitHub Pages has to be switched
    # on once for the gh-pages branch (Settings -> Pages).
    needs: [version, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      APT_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - name: Without a signing key
        if: env.APT_KEY == ''
        run: echo 'No APT_GPG_PRIVATE_KEY secret - skipped.'

      - uses: actions/checkout@v7
        if: env.APT_KEY != ''

      - uses: actions/download-artifact@v8
        if: env.APT_KEY != ''
        with:
          name: linux
          path: debs

      - name: Update the repository
        if: env.APT_KEY != ''
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$REMOTE" site
          else
            mkdir site
          fi
          echo "$APT_KEY" | gpg --batch --import
          python3 packaging/linux/apt_repo.py site/apt debs/*.deb
          gpg --batch --yes --export > site/apt/key.gpg
          gpg --batch --yes --clearsign -o site/apt/dists/stable/InRelease site/apt/dists/stable/Release
          gpg --batch --yes --armor --detach-sign -o site/apt/dists/stable/Release.gpg site/apt/dists/stable/Release
          touch site/.nojekyll
          # One commit without history, replacing the branch: old packages don't
          # pile up in it (each .deb is tens of MB).
          rm -rf site/.git
          git -C site init -q -b gh-pages
          git -C site add -A
          git -C site commit -q -m "apt repository: ${{ needs.version.outputs.version }}"
          git -C site push --force "$REMOTE" gh-pages

  winget:
    # Keeps the winget package current, with Microsoft's own wingetcreate (the
    # winget-releaser action no longer loads on current runners). The very first
    # version has to be submitted by hand once (see packaging/winget/README.md).
    needs: [version, release]
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Submit to winget
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host 'No WINGET_TOKEN secret - skipped.'; exit 0 }
          $v = '${{ needs.version.outputs.version }}'
          $base = "https://github.com/${{ github.repository }}/releases/download/v$v"
          Invoke-WebRequest 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe
          # x64 also covers Windows on ARM, which runs it through emulation.
          .\wingetcreate.exe update F0uP.StreetviewTourEditor --version $v `
            --urls "$base/StreetviewTourEditor-$v-Setup.exe|x64" "$base/StreetviewTourEditor-$v-Setup-x86.exe|x86" `
            --submit --token $env:WINGET_TOKEN
