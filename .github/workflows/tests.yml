name: Tests

# The editor and its local server, tested in headless Chromium (tests/). Runs on
# every push and pull request, and before every release build (build-release.yml).
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium

      - name: Check the bundled web libraries
        run: python packaging/vendor.py --check

      - name: Run the tests
        run: python -m pytest tests -q --tb=short

      - name: Keep the app's log when something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          path: /tmp/pytest-of-*/**/server.log
          if-no-files-found: ignore
